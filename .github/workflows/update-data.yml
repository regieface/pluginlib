name: Mise à jour des données

on:
  schedule:
    - cron: '17 3 * * 0'   # dimanche à 03:17 UTC ; collecte une semaine sur deux
  workflow_dispatch:
    inputs:
      vendor:
        description: "Ne collecter qu'un constructeur (nom exact, vide = tous)"
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  cadence:
    runs-on: ubuntu-latest
    outputs:
      collect: ${{ steps.calendar.outputs.collect }}
    steps:
      - name: Vérifier la quinzaine
        id: calendar
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import date, datetime, timezone

          # Ancrage fixe : dimanches 15/11, 29/11, 13/12, etc.
          today = datetime.now(timezone.utc).date()
          weeks = (today - date(2026, 11, 15)).days // 7
          collect = os.environ['EVENT_NAME'] == 'workflow_dispatch' or weeks % 2 == 0
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'collect={str(collect).lower()}\n')
          print('Collecte autorisée.' if collect else 'Semaine sans collecte.')
          PY

  update:
    needs: cadence
    if: needs.cadence.outputs.collect == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests des analyseurs
        run: |
          node --test scripts/*.test.mjs
          python3 -m unittest discover -s scripts -p '*_test.py'
      - name: Collecte
        env:
          ONLY_VENDOR: ${{ github.event.inputs.vendor }}
          PLUGINLIB_HTTP_CACHE: ${{ runner.temp }}/pluginlib-http
        run: |
          node scripts/free-products.mjs
          node scripts/update.mjs
          node scripts/sync-free-products.mjs
          node scripts/enrich-catalog.mjs
          node scripts/prepare-presentations.mjs
          node scripts/description-coverage.mjs
          node scripts/review-pending-families.mjs
          node scripts/subscription-plans.mjs
          node scripts/audit-catalog.mjs
          node scripts/retailer-prices.mjs
          node scripts/audit-integrity.mjs --fetch-missing
      - name: Enregistrer si les données ont changé
        run: |
          git config user.name "pluginlib-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/free-products.json data/family-source-review.json data/description-coverage.json data/plugins.json data/meta.json data/diagnostic.json data/quality-report.json data/quality-report.md data/integrity-report.json data/integrity-report.md data/subscriptions.json sources/retailer-links.json
          if git diff --cached --quiet; then echo "Aucun changement."; exit 0; fi
          git commit -m "données : mise à jour du $(date -u +%Y-%m-%d)"
          # Si quelqu'un a poussé pendant la collecte, on se remet à jour avant d'envoyer
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
