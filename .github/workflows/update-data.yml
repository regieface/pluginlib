name: Mise à jour des données

on:
  schedule:
    - cron: '17 3 1 * *'   # le 1er de chaque mois à 03:17 UTC
  workflow_dispatch:
    inputs:
      vendor:
        description: "Ne collecter qu'un constructeur (nom exact, vide = tous)"
        required: false
        default: ''
  push:
    paths: ['scripts/**', 'sources/**', 'data/overrides.json']

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests des analyseurs
        run: node --test scripts/parsers.test.mjs
      - name: Collecte
        env:
          ONLY_VENDOR: ${{ github.event.inputs.vendor }}
        run: node scripts/update.mjs
      - name: Enregistrer si les données ont changé
        run: |
          git config user.name "pluginlib-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/plugins.json data/meta.json data/diagnostic.json
          if git diff --cached --quiet; then echo "Aucun changement."; exit 0; fi
          git commit -m "données : mise à jour du $(date -u +%Y-%m-%d)"
          # Si quelqu'un a poussé pendant la collecte, on se remet à jour avant d'envoyer
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
